name: Copy-bet probe (throwaway)
on:
  push:
    branches: [claude/copy-bet-probe]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Web and app-link files
        continue-on-error: true
        run: python scripts/probe_copybet.py 2>&1 | tee /tmp/probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            /tmp/out/facts.json
            /tmp/out/package.txt
            /tmp/apk/*.apk
          if-no-files-found: ignore
      - name: Save output to the copybet-probe-output branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/save && cp /tmp/probe.txt /tmp/apk.txt /tmp/save/ 2>/dev/null || true
          cp /tmp/out/*.png /tmp/out/*.json /tmp/out/*.txt /tmp/out/js.tar.gz /tmp/save/ 2>/dev/null || true
          git checkout --orphan copybet-probe-output
          git rm -rqf .
          cp /tmp/save/* . && git add -A . && git commit -qm "Copy-bet probe output for ${GITHUB_SHA::7}"
          git push -qf origin copybet-probe-output

