name: CI
on:
  workflow_dispatch:
    inputs:
      lookback:
        description: unused on the probe branch
        default: "15"
      min_stake:
        description: unused on the probe branch
        default: "100"
      rfq_seconds:
        description: unused on the probe branch
        default: "10"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Probe Kalshi links
        run: python scripts/probe_links2.py 2>&1 | tee /tmp/probe.txt
      - name: Save probe output to the link-probe-output branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan link-probe-output
          git rm -rqf .
          cp /tmp/probe.txt probe.txt || echo "no output" > probe.txt
          git add probe.txt
          git commit -qm "Link probe output for ${GITHUB_SHA::7}"
          git push -qf origin link-probe-output
