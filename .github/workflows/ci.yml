name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      lookback:
        description: Minutes of trades to pull
        default: "15"
      min_stake:
        description: Minimum bet size in dollars
        default: "100"
      rfq_seconds:
        description: Seconds to listen to live RFQs
        default: "180"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Live check against Kalshi
        run: |
          set -o pipefail
          python scripts/live_check.py ${{ inputs.lookback || '15' }} ${{ inputs.min_stake || '100' }} 2>&1 | tee /tmp/live_check.txt
      - name: Live check of the Bettors tracker
        if: always()
        run: |
          set -o pipefail
          echo -e "\n===== Bettors =====" >> /tmp/live_check.txt
          python scripts/live_bettors.py 12 400 2>&1 | tee -a /tmp/live_check.txt
      - name: Live check of RFQ matching (needs the API key secrets)
        if: always()
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -o pipefail
          echo -e "\n===== RFQ matching =====" >> /tmp/live_check.txt
          python scripts/live_rfq.py ${{ inputs.rfq_seconds || '180' }} 2>&1 | tee -a /tmp/live_check.txt
      - name: Live check of the tail bot (3 min dry run, needs the API key secrets)
        if: always()
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -o pipefail
          echo -e "\n===== Tail bot =====" >> /tmp/live_check.txt
          if [ -z "$KALSHI_KEY_ID" ]; then echo "No API key; skipping." | tee -a /tmp/live_check.txt; exit 0; fi
          DRY_RUN=1 TAIL_SELFTEST=1 TAIL_MINUTES=3 TAIL_STATE_FILE=/tmp/tail_state.sealed TAIL_HISTORY_FILE=/tmp/tail_history.sealed \
            python scripts/tail_bot.py 2>&1 | tee -a /tmp/live_check.txt
      - name: Live check of the bettor recorder (3 min dry run, needs the API key secrets)
        if: always()
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -o pipefail
          echo -e "\n===== Bettor recorder =====" >> /tmp/live_check.txt
          if [ -z "$KALSHI_KEY_ID" ]; then echo "No API key; skipping." | tee -a /tmp/live_check.txt; exit 0; fi
          DRY_RUN=1 RECORDER_MINUTES=3 RECORDER_SAVE_EVERY=60 WHALE_MIN=1000 WHALE_TRACK_MIN=200 BETTOR_TAGS=JohnR0809 \
            python scripts/recorder_bot.py 2>&1 | tee -a /tmp/live_check.txt
      - name: Save live check output to the ci-output branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-output
          git rm -rqf .
          cp /tmp/live_check.txt live_check.txt || echo "no output" > live_check.txt
          git add live_check.txt
          git commit -qm "Live check output for ${GITHUB_SHA::7}"
          git push -qf origin ci-output
