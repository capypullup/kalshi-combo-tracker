name: Probe
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/live_bettors.py", "combo_tracker/**", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/live_bettors.py 12 400 4thewin zzz.not.real.9 Hughman 2>&1 | tee /tmp/probe.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-output
          git rm -rqf .
          cp /tmp/probe.txt probe.txt || echo "no output" > probe.txt
          git add probe.txt
          git commit -qm "Probe output for ${GITHUB_SHA::7}"
          git push -qf origin probe-output
